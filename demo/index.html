<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Filled elevation contours generated in the browser for MapLibre GL JS." />
        <title>Filled contours · MapLibre</title>
        <script type="module" src="/main.ts"></script>
    </head>
    <body>
        <main id="app">
            <div id="map" aria-label="Interactive filled contour map"></div>
            <section class="panel">
                <p class="eyebrow">MapLibre GL JS plugin</p>
                <h1>Filled contours</h1>
                <p class="lede">
                    Elevation is decoded from Terrarium tiles and converted into non-overlapping
                    MLT isobands in a web worker. The lowest band, below sea level, is omitted.
                </p>
                <div class="legend" aria-label="Elevation legend">
                    <span><i style="--color:#f1f8e9"></i>0–250 m</span>
                    <span><i style="--color:#aed581"></i>500–1,000 m</span>
                    <span><i style="--color:#558b2f"></i>1,500–2,000 m</span>
                    <span><i style="--color:#eceff1"></i>3,000+ m</span>
                </div>
                <a
                    class="repository-link"
                    href="https://github.com/yutannihilation/maplibre-filled-contour"
                    target="_blank"
                    rel="noreferrer"
                >
                    View source on GitHub <span aria-hidden="true">↗</span>
                </a>
            </section>
        </main>
    </body>
</html>
